<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Menu 3D CAFE | Daftar Kopi & Makanan Lengkap</title>
    <meta name="description" content="Eksplorasi seluruh menu minuman, kopi artisan, artisan tea, cemilan, dan main course premium khas 3D CAFE Poris Indah.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Poppins', 'sans-serif'], 
                        serif: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        primary: '#06B6D4', secondary: '#F3F4F6',
                        accent: '#22D3EE', dark: '#0B0F19',
                        darkbrown: '#111827', golden: '#06B6D4'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-secondary font-sans antialiased overflow-x-hidden relative min-h-screen">
    
    <a href="index.html" class="fixed top-6 left-6 z-50 glass-panel bg-white/10 shadow-lg border border-primary/30 text-secondary px-5 py-2.5 rounded-full flex items-center gap-2 font-semibold hover:bg-primary hover:text-dark transition-all duration-300 hover:scale-105">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg> Beranda
    </a>

    <main class="max-w-6xl mx-auto px-6 pt-28 pb-20 relative z-10 w-full">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold text-accent font-serif">Buku Menu</h1>
            <p class="text-gray-400 mt-2 font-light">Freshly roasted, artisan brewing, and delicious foods.</p>
        </header>

        <div class="max-w-md mx-auto mb-10">
            <input type="text" id="menu-search" placeholder="Cari menu favoritmu (kopi, pasta...)" class="w-full border border-white/10 rounded-2xl px-5 py-3 bg-white/5 focus:outline-none focus:ring-2 focus:ring-primary text-white text-center">
        </div>

        <div class="overflow-x-auto hide-scrollbar mb-10 w-full">
            <div class="flex gap-3 px-6 w-max mx-auto">
                <button onclick="filterMenuPage('Semua', this)" class="menu-filter-btn px-6 py-2.5 bg-primary text-dark rounded-full font-bold whitespace-nowrap transition-colors shadow-md">Semua</button>
                <button onclick="filterMenuPage('Essential Coffee', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Essential Coffee</button>
                <button onclick="filterMenuPage('Signature Drink', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Signature Drink</button>
                <button onclick="filterMenuPage('Tea Based', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Tea Based</button>
                <button onclick="filterMenuPage('Other Beverage', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Other Beverage</button>
                <button onclick="filterMenuPage('Artisan Tea', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Artisan Tea</button>
                <button onclick="filterMenuPage('Snacks', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Snacks</button>
                <button onclick="filterMenuPage('Main Course', this)" class="menu-filter-btn px-6 py-2.5 glass-panel border border-white/10 text-secondary rounded-full font-medium whitespace-nowrap hover:bg-white/10 transition-colors">Main Course</button>
            </div>
        </div>

        <div id="full-menu-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 px-2 max-w-full overflow-hidden">
            <div class="col-span-full text-center text-gray-400 py-10 animate-pulse">Memuat seluruh buku menu...</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
